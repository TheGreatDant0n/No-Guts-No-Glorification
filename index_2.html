<title>Vitality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#07080B;
    --surface:#121319;
    --surface-2:#181B22;
    --surface-raised:#1E222B;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);
    --text:#F3F5F8;
    --text-muted:#939BAB;
    --text-faint:#5B6472;
    --cyan:#37E9E1;
    --amber:#FF9B45;
    --red:#FF5C5C;
    --violet:#C79CFF;
    --green:#3ED598;
    --ring-track:rgba(255,255,255,0.07);
    --shadow: 0 16px 44px -18px rgba(0,0,0,0.75);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 560px at 50% -8%, rgba(255,110,60,0.12), transparent 60%),
      radial-gradient(700px 460px at 100% 105%, rgba(55,233,225,0.07), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Chakra Petch', 'Plus Jakarta Sans', sans-serif;
    text-wrap:balance;
    letter-spacing:0.01em;
  }
  .mono{ font-family:'Space Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .eyebrow{ font-size:0.66rem; text-transform:uppercase; letter-spacing:0.11em; font-weight:700; color:var(--text-faint); }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; }

  #app-root{ display:flex; justify-content:center; min-height:100vh; padding: 18px 12px 40px; }
  .phone{
    width:100%; max-width:430px;
    background:var(--bg);
    border-radius:32px;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
    min-height:calc(100vh - 36px);
    display:flex;
    flex-direction:column;
  }

  /* ---------- header ---------- */
  .hud-header{ padding:18px 20px 12px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .hud-status{ display:flex; align-items:center; gap:6px; font-size:0.62rem; letter-spacing:0.14em; font-weight:700; color:var(--cyan); text-transform:uppercase; margin-bottom:6px; }
  .status-dot{ width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  .hud-row{ display:flex; align-items:center; justify-content:space-between; }
  .wordmark{ margin:0; font-size:1.5rem; font-weight:700; letter-spacing:0.01em; }
  .wordmark .dot-accent{ color:var(--amber); }
  .hud-actions{ display:flex; gap:8px; }
  .icon-btn{
    width:36px;height:36px;border-radius:11px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{ transform:scale(0.94); }
  .icon-btn svg{ width:17px; height:17px; }
  .hud-sub{ margin-top:6px; font-size:0.72rem; color:var(--text-faint); font-weight:600; letter-spacing:0.01em; }
  .hud-sub b{ color:var(--text-muted); font-weight:700; }
  .hud-sub .accent{ color:var(--amber); font-weight:700; }

  .screen{ flex:1; overflow-y:auto; padding:16px 18px 96px; -webkit-overflow-scrolling:touch; }
  .screen::-webkit-scrollbar{ width:0; }

  .tabbar{
    position:absolute; left:0; right:0; bottom:0; display:flex;
    background:var(--surface); border-top:1px solid var(--border);
    padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px)); gap:2px; z-index:20;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; cursor:pointer; color:var(--text-faint);
    padding:6px 2px; border-radius:12px; font-size:0.64rem; font-weight:700; letter-spacing:0.02em;
  }
  .tab.active{ color:var(--amber); }
  .tab svg{ width:20px; height:20px; }

  /* ---------- week strip / date nav ---------- */
  .week-strip{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:16px; }
  .day-chip{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:8px 0 7px; text-align:center; cursor:pointer;
  }
  .day-chip .dl{ font-size:0.58rem; color:var(--text-faint); font-weight:700; letter-spacing:0.06em; }
  .day-chip .dn{ font-family:'Space Mono'; font-size:0.98rem; font-weight:700; margin-top:2px; }
  .day-chip .du{ width:16px; height:2px; margin:5px auto 0; border-radius:2px; background:var(--border-strong); }
  .day-chip.selected{ border-color:var(--red); box-shadow:0 0 0 1px var(--red); }
  .day-chip.today .dn{ color:var(--cyan); }

  .date-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .date-nav h2{ margin:2px 0 0; font-size:1.3rem; }

  /* ---------- ring + stats ---------- */
  .ring-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; margin-bottom:12px; }
  .ring-wrap{ position:relative; width:168px; height:168px; margin:0 auto; }
  .ring-wrap svg{ transform:rotate(-90deg); width:100%; height:100%; }
  .ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .ring-center .num{ font-family:'Space Mono'; font-size:1.7rem; font-weight:700; }
  .ring-center .lbl{ font-size:0.62rem; color:var(--text-faint); font-weight:700; letter-spacing:0.06em; text-transform:uppercase; }
  .ring-eyebrow{ text-align:center; margin-bottom:4px; }

  .stat-tiles{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px; }
  .stat-tile{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 8px; text-align:center; }
  .stat-tile .eyebrow{ margin-bottom:6px; }
  .stat-tile .val{ font-family:'Space Mono'; font-size:1.15rem; font-weight:700; }
  .stat-tile .unit{ font-size:0.6rem; color:var(--text-faint); font-weight:700; letter-spacing:0.04em; }

  /* ---------- 7-day chart ---------- */
  .chart-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 18px; margin-bottom:12px; }
  .chart-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .chart-bars{ display:flex; align-items:flex-end; gap:6px; height:64px; }
  .chart-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .chart-bar{ width:100%; max-width:26px; border-radius:6px 6px 3px 3px; background:var(--cyan); opacity:0.55; min-height:4px; }
  .chart-bar.selected{ opacity:1; box-shadow:0 0 12px rgba(55,233,225,0.55); }
  .chart-col .dl{ font-size:0.6rem; color:var(--text-faint); font-weight:700; }
  .chart-col .dl.selected{ color:var(--red); }

  /* ---------- volume / readiness ---------- */
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .mini-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; }
  .figure-row{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .muscle-list{ display:flex; flex-direction:column; gap:3px; }
  .muscle-list span{ font-size:0.68rem; font-weight:700; letter-spacing:0.04em; color:var(--amber); }
  .muscle-list.rest span{ color:var(--text-faint); font-weight:600; text-transform:none; letter-spacing:0; }
  .readiness-val{ font-family:'Space Mono'; font-size:1.6rem; font-weight:700; margin-top:4px; }
  .readiness-val .pct{ font-size:1rem; color:var(--text-faint); }
  .gauge-track{ height:6px; border-radius:6px; margin-top:10px; background:linear-gradient(90deg, var(--red), var(--amber), var(--cyan)); position:relative; }
  .gauge-dot{ position:absolute; top:50%; width:10px; height:10px; border-radius:50%; background:#fff; border:2px solid var(--bg); transform:translate(-50%,-50%); }
  .gauge-labels{ display:flex; justify-content:space-between; margin-top:5px; font-size:0.58rem; color:var(--text-faint); font-weight:700; letter-spacing:0.05em; }
  .readiness-note{ margin-top:8px; font-size:0.68rem; color:var(--text-muted); }
  .readiness-basis{ font-size:0.6rem; color:var(--text-faint); margin-top:2px; }

  /* ---------- metabolic intake ---------- */
  .metabolic-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 18px; margin-bottom:16px; }
  .metabolic-head{ display:flex; justify-content:space-between; margin-bottom:12px; }
  .macro-row{ margin-bottom:10px; }
  .macro-row:last-child{ margin-bottom:0; }
  .macro-row .row-head{ display:flex; justify-content:space-between; font-size:0.72rem; margin-bottom:5px; }
  .macro-row .row-head .name{ color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; font-size:0.66rem; }
  .macro-row .row-head .val{ font-family:'Space Mono'; font-size:0.72rem; }
  .bar{ height:8px; border-radius:100px; background:var(--ring-track); overflow:hidden; }
  .bar > i{ display:block; height:100%; border-radius:100px; }

  /* ---------- segmented control ---------- */
  .seg{ display:flex; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:4px; gap:3px; margin-bottom:14px; }
  .seg button{ flex:1; border:none; background:transparent; padding:9px 6px; border-radius:10px; font-size:0.78rem; font-weight:700; color:var(--text-muted); cursor:pointer; }
  .seg button.active{ background:var(--surface-raised); color:var(--text); box-shadow:inset 0 0 0 1px var(--red); }

  /* ---------- schedule rows ---------- */
  .sched-row{ display:flex; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border); cursor:pointer; align-items:flex-start; }
  .sched-row:last-child{ border-bottom:none; }
  .sched-time{ font-family:'Space Mono'; font-size:0.72rem; color:var(--text-faint); width:40px; flex-shrink:0; padding-top:9px; }
  .sched-icon{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sched-icon svg{ width:16px; height:16px; }
  .sched-icon.meal{ background:rgba(255,155,69,0.14); color:var(--amber); }
  .sched-icon.workout{ background:rgba(255,92,92,0.14); color:var(--red); }
  .sched-body{ flex:1; min-width:0; }
  .sched-title{ font-weight:700; font-size:0.88rem; }
  .sched-title.done{ text-decoration:line-through; color:var(--text-faint); }
  .sched-sub{ font-size:0.72rem; color:var(--text-faint); margin-top:2px; }
  .sched-check{ width:22px; height:22px; border-radius:7px; border:2px solid var(--border-strong); flex-shrink:0; margin-top:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .sched-check.on{ background:var(--green); border-color:var(--green); color:#052; }

  /* ---------- workout session ---------- */
  .session-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; margin-bottom:14px; }
  .diff-pill{ padding:4px 10px; border-radius:100px; font-size:0.62rem; font-weight:800; letter-spacing:0.05em; border:1px solid; text-transform:uppercase; }
  .diff-pill.Hard{ color:var(--red); border-color:var(--red); }
  .diff-pill.Moderate{ color:var(--amber); border-color:var(--amber); }
  .diff-pill.Easy{ color:var(--green); border-color:var(--green); }
  .session-stats{ display:flex; gap:16px; margin-top:8px; }
  .session-stats .item{ display:flex; align-items:center; gap:5px; font-size:0.76rem; color:var(--text-muted); font-weight:600; }
  .session-stats svg{ width:14px; height:14px; color:var(--text-faint); }
  .strain-track{ height:5px; border-radius:6px; background:var(--ring-track); margin-top:12px; overflow:hidden; }
  .strain-track i{ display:block; height:100%; background:linear-gradient(90deg, var(--amber), var(--red)); border-radius:6px; }

  .exercise-row{ border:1px solid var(--border); border-radius:14px; padding:12px 14px; background:var(--surface-2); }
  .exercise-row + .exercise-row{ margin-top:10px; }
  .exercise-row.done{ border-color:var(--green); background:rgba(62,213,152,0.06); }
  .checkbox{
    width:24px; height:24px; border-radius:8px; border:2px solid var(--border-strong); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--surface);
  }
  .checkbox.on{ background:var(--green); border-color:var(--green); color:#04241D; }
  .ex-time{ font-family:'Space Mono'; font-size:0.7rem; color:var(--text-faint); }

  /* ---------- meal cards ---------- */
  .meal-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; margin-bottom:12px; }
  .meal-eyebrow{ color:var(--amber); }
  .meal-title{ margin:4px 0 2px; font-size:1.02rem; }
  .meal-tagline{ font-size:0.78rem; color:var(--text-muted); font-style:italic; margin-bottom:8px; }
  .meal-ingredients{ font-size:0.76rem; color:var(--text-faint); line-height:1.5; margin-bottom:10px; }
  .meal-stats-row{ display:flex; justify-content:space-between; align-items:center; }
  .meal-stats{ font-family:'Space Mono'; font-size:0.76rem; color:var(--text-muted); display:flex; gap:10px; }
  .meal-stats b{ color:var(--text); }

  /* ---------- generic ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; }
  .card + .card{ margin-top:14px; }
  .section{ margin-bottom:18px; }
  .section-title{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.09em; color:var(--text-faint); font-weight:700; margin:0 0 10px 2px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .between{ justify-content:space-between; }
  .stack{ display:flex; flex-direction:column; gap:10px; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:100px; font-size:0.7rem; font-weight:700; background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border); white-space:nowrap; }
  .pill.on{ background:rgba(255,155,69,0.12); color:var(--amber); border-color:var(--amber); }
  .pill.success{ color:var(--green); border-color:var(--green); }
  .pill.warning{ color:var(--amber); border-color:var(--amber); }
  .pill.danger{ color:var(--red); border-color:var(--red); }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 18px; border-radius:14px; font-weight:700; font-size:0.88rem; border:1px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer; width:100%; }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:linear-gradient(135deg, var(--amber), var(--red)); color:#1A0A05; border:none; box-shadow:0 8px 20px -8px rgba(255,92,92,0.5); }
  .btn-cyan{ background:transparent; border:1px solid var(--cyan); color:var(--cyan); }
  .btn-ghost{ background:transparent; border:1px dashed var(--border); }
  .btn-sm{ padding:9px 14px; font-size:0.78rem; width:auto; }
  .btn-danger{ background:transparent; color:var(--red); border-color:var(--red); }

  label.field{ display:flex; flex-direction:column; gap:6px; font-size:0.78rem; color:var(--text-muted); font-weight:600; }
  input[type=text], input[type=number], select, textarea{
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:11px 12px; color:var(--text); font-size:0.92rem; width:100%;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--cyan); outline-offset:1px; }

  .chip-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ padding:9px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); font-size:0.8rem; font-weight:600; cursor:pointer; }
  .chip.on{ background:rgba(255,155,69,0.12); border-color:var(--amber); color:var(--amber); }

  .day-cell{ aspect-ratio:1; border-radius:12px; border:1px solid var(--border); background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; font-size:0.78rem; font-weight:600; position:relative; }
  .day-cell.today{ border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan); }
  .day-cell.other-month{ opacity:0.3; }
  .day-cell .dots{ display:flex; gap:3px; }
  .day-cell .dot{ width:5px;height:5px;border-radius:50%; }

  .food-suggest{ max-height:220px; overflow-y:auto; border:1px solid var(--border); border-radius:12px; margin-top:6px; }
  .food-opt{ padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; font-size:0.84rem; }
  .food-opt:last-child{ border-bottom:none; }
  .food-opt:hover, .food-opt:active{ background:var(--surface-2); }

  .modal-backdrop{ position:absolute; inset:0; background:rgba(2,3,5,0.65); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
  .modal-sheet{ background:var(--surface); width:100%; max-height:88%; overflow-y:auto; border-radius:24px 24px 0 0; padding:20px 20px 28px; border:1px solid var(--border); border-bottom:none; }
  .modal-handle{ width:38px; height:4px; border-radius:4px; background:var(--border-strong); margin:0 auto 14px; }

  .empty-note{ font-size:0.8rem; color:var(--text-faint); text-align:center; padding:14px 6px; }
  .divider{ height:1px; background:var(--border); margin:14px 0; }
  a.link{ color:var(--cyan); text-decoration:none; font-weight:600; font-size:0.8rem; }
  .glow-text{ background:linear-gradient(135deg, var(--amber), var(--red)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  ::selection{ background:rgba(255,155,69,0.35); }

  /* ---------- voice FAB + overlay ---------- */
  .voice-fab{
    position:absolute; right:16px; bottom:78px; z-index:25;
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--amber), var(--red));
    color:#1A0A05; display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 24px -8px rgba(255,92,92,0.6);
  }
  .voice-fab:active{ transform:scale(0.94); }
  .voice-fab svg{ width:22px; height:22px; }
  .voice-fab.listening{ animation:mic-pulse 1.4s ease-in-out infinite; }
  @keyframes mic-pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,92,92,0.55);} 50%{ box-shadow:0 0 0 14px rgba(255,92,92,0);} }
  .voice-bubble{ background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:12px 14px; font-size:0.86rem; margin-bottom:10px; }
  .voice-bubble.you{ color:var(--text-muted); }
  .voice-bubble.app{ color:var(--text); border-color:var(--cyan); }
  .voice-suggest{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .voice-suggest button{ font-size:0.72rem; padding:7px 10px; border-radius:100px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); cursor:pointer; }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>

<div id="app-root"></div>

<script>
/* ============================= DATA ============================= */

const ACTIVITY_MULT = { sedentary:1.2, light:1.375, moderate:1.55, active:1.725, veryActive:1.9 };
const ACTIVITY_LABELS = {
  sedentary:'Sedentary (desk job, little exercise)',
  light:'Light (exercise 1-3x/week)',
  moderate:'Moderate (exercise 3-5x/week)',
  active:'Active (exercise 6-7x/week)',
  veryActive:'Very active (hard training or physical job)'
};

const EXERCISE_METS = [
  {name:'Walking (casual, 3 mph)', met:3.5},
  {name:'Walking (brisk, 4 mph)', met:5.0},
  {name:'Jogging (5 mph)', met:8.3},
  {name:'Running (6 mph)', met:9.8},
  {name:'Running (7.5 mph)', met:11.8},
  {name:'Cycling (leisure, <10 mph)', met:4.0},
  {name:'Cycling (moderate, 12-14 mph)', met:8.0},
  {name:'Cycling (vigorous, 16-19 mph)', met:10.0},
  {name:'Swimming (leisure)', met:6.0},
  {name:'Swimming (laps, vigorous)', met:9.8},
  {name:'Elliptical trainer', met:5.0},
  {name:'Rowing machine (moderate)', met:7.0},
  {name:'Jump rope', met:11.8},
  {name:'Yoga', met:3.0},
  {name:'Pilates', met:3.0},
  {name:'HIIT / circuit training', met:8.0},
  {name:'Basketball (game)', met:6.5},
  {name:'Soccer (game)', met:7.0},
  {name:'Tennis (singles)', met:7.3},
  {name:'Hiking (hills, pack)', met:6.0},
  {name:'Dancing (aerobic)', met:4.8},

/* ============================= UNIT HELPERS ============================= */
function cmToFtIn(cm){ const totalIn = cm/2.54; const ft = Math.floor(totalIn/12); const inch = Math.round(totalIn - ft*12); return {ft, inch}; }
function ftInToCm(ft, inch){ return Math.round(((ft*12)+(inch||0))*2.54); }
function kgToLb(kg){ return Math.round(kg*2.20462); }
function lbToKg(lb){ return lb/2.20462; }
function fmtHeight(p){
  if(p.units==='imperial'){ const {ft,inch}=cmToFtIn(p.heightCm); return ft+"'"+inch+'"'; }
  return Math.round(p.heightCm)+' cm';
}
function fmtWeight(p){
  if(p.units==='imperial') return kgToLb(p.weightKg)+' lb';
  return Math.round(p.weightKg)+' kg';
}

  return {profile:null, logs:{}, exerciseHistory:{}, startEpochDay:null};
}

function epochDay(d){ return Math.floor(d.getTime()/86400000); }
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDateKey(key){ const [y,m,dd] = key.split('-').map(Number); const d = new Date(y,m-1,dd); d.setHours(0,0,0,0); return d; }
function todayDate(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }

function calcBMR(p){
  const {weightKg,heightCm,age,gender} = p;
  if(gender==='male') return 10*weightKg + 6.25*heightCm - 5*age + 5;
  if(gender==='female') return 10*weightKg + 6.25*heightCm - 5*age - 161;
  return 10*weightKg + 6.25*heightCm - 5*age - 78;
}
function calcDerived(p){
  const bmr = calcBMR(p);
  const tdee = bmr * ACTIVITY_MULT[p.activityLevel];
  let calorieTarget;
  if(p.goal==='lose') calorieTarget = Math.max(tdee-500, p.gender==='male'?1500:1200);
  else if(p.goal==='gain') calorieTarget = tdee+350;
  else calorieTarget = tdee;
  const proteinPerKg = p.goal==='lose' ? 2.0 : p.goal==='gain' ? 1.8 : 1.6;
  const proteinG = Math.round(proteinPerKg * p.weightKg);
  const proteinCal = proteinG*4;
  const fatG = Math.round(Math.max(0.8*p.weightKg, calorieTarget*0.25/9));
  const fatCal = fatG*9;
  const carbCal = Math.max(calorieTarget - proteinCal - fatCal, 0);
  const carbG = Math.round(carbCal/4);
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), calorieTarget:Math.round(calorieTarget), proteinG, fatG, carbG};
}
function calcBMI(p){ const hM = p.heightCm/100; return p.weightKg/(hM*hM); }
function bmiCategory(bmi){
  if(bmi<18.5) return 'underweight';
  if(bmi<25) return 'normal';
  if(bmi<30) return 'overweight';
  return 'obese';
}

function dietFilter(recipe, prefs){
  if(prefs.includes('vegan')) return recipe.vegan;
  if(prefs.includes('vegetarian') && !recipe.vegetarian) return false;
  if(prefs.includes('glutenFree') && !recipe.glutenFree) return false;
  if(prefs.includes('lactoseFree') && !recipe.dairyFree) return false;
  return true;
}
function recipesForSlot(slot, prefs){
  const pool = RECIPES.filter(r=>r.slot===slot && dietFilter(r,prefs));
  return pool.length ? pool : RECIPES.filter(r=>r.slot===slot);
}
function mealsForDate(d, profile){
  const ed = epochDay(d);
  const slots = ['breakfast','lunch','snack','dinner'];
  const prefs = profile.dietPrefs||[];
  return slots.map(slot=>{
    const pool = recipesForSlot(slot, prefs);
    const idx = ed % pool.length;
    return {slot, time:MEAL_TIMES[slot], recipe:pool[idx]};
  });
}
function workoutForDate(d, profile){
  const weekday = ((d.getDay()+6)%7)+1;
  const split = WORKOUT_SPLITS[profile.daysPerWeek] || WORKOUT_SPLITS[4];
  const tmpl = split[weekday];
  if(!tmpl || !tmpl.exercises) return {label:'Rest & Recovery', exercises:[]};
  const reps = repsForGoal(profile.goal);
  const sets = setsForGoal(profile.goal);
  return {label:tmpl.label, exercises: tmpl.exercises.map(id=>({id, ...EX[id], reps, sets}))};
}
function exerciseTimeMin(ex){ return Math.round(ex.sets * (ex.heavy ? 4 : 2.5)); }
function workoutDurationMin(w){ return w.exercises.reduce((s,e)=>s+exerciseTimeMin(e),0); }
function workoutCalories(w, weightKg){ return estimateCaloriesFromMet(6.0, weightKg, workoutDurationMin(w)); }
function difficultyForWorkout(w){
  if(!w.exercises.length) return null;
  const totalSets = w.exercises.reduce((s,e)=>s+e.sets,0);
  if(totalSets >= 18) return 'Hard';
  if(totalSets >= 12) return 'Moderate';
  return 'Easy';
}
function muscleGroupsForWorkout(w){ return [...new Set(w.exercises.map(e=>e.muscle))]; }

function recoveryScore(selectedDate, profile){
  let score = 100;
  for(let i=1;i<=3;i++){
    const d = addDays(selectedDate, -i);
    const wk = workoutForDate(d, profile);
    if(wk.exercises.length) score -= (14 - i*3);
  }
  const today = workoutForDate(selectedDate, profile);
  if(!today.exercises.length) score += 6;
  return Math.max(40, Math.min(100, Math.round(score)));
}
function recoveryCaption(score){
  if(score>=90) return 'Optimal for a hard session';
  if(score>=75) return 'Good — ready to train';
  if(score>=60) return 'Moderate — consider lighter intensity';
  return 'Low — prioritize recovery today';
}

function getLog(key){
  if(!state.logs[key]) state.logs[key] = {completedExercises:[], workoutDone:false, completedMeals:[], extraWorkouts:[], extraMeals:[]};
  return state.logs[key];
}

function estimateCaloriesFromMet(met, weightKg, minutes){ return Math.round(met * weightKg * (minutes/60)); }
function estimateWorkoutSessionCalories(numExercises, weightKg){ return estimateCaloriesFromMet(5.0, weightKg, numExercises*7); }

function foodSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const starts = [], includes = [];
  FOOD_DB.forEach(f=>{
    const n = f.n.toLowerCase();
    if(n.startsWith(q)) starts.push(f);
    else if(n.includes(q)) includes.push(f);
  });
  return starts.concat(includes).slice(0,8);
}

function logExerciseSet(exId, weight, reps){
  if(!state.exerciseHistory[exId]) state.exerciseHistory[exId] = [];
  const key = dateKey(todayDate());
  const hist = state.exerciseHistory[exId];
  const existing = hist.find(h=>h.date===key);
  if(existing){ existing.weight=weight; existing.reps=reps; }
  else hist.push({date:key, weight, reps});
  saveState();
}
function lastLoggedWeight(exId){
  const hist = state.exerciseHistory[exId];
  if(!hist || !hist.length) return null;
  const todayKey = dateKey(todayDate());
  const prior = hist.filter(h=>h.date!==todayKey);
  if(!prior.length) return null;
  return prior[prior.length-1];
}

/* ============================= CALENDAR EXPORT ============================= */
function dateAtTime(dateObj, hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const d = new Date(dateObj); d.setHours(h,m,0,0);
  return d;
}
function icsFmt(d){ return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; }
function icsEscape(s){ return String(s).replace(/[\\,;]/g, m=>'\\'+m).replace(/\n/g,'\\n'); }
function gcalLink(title, description, startDate, durationMin){
  const end = new Date(startDate.getTime() + durationMin*60000);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(title)
    + '&dates=' + icsFmt(startDate) + '/' + icsFmt(end)
    + '&details=' + encodeURIComponent(description||'');
}
function generateICS(profile, days){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Vitality//App//EN','CALSCALE:GREGORIAN'];
  const stamp = icsFmt(new Date());
  for(let i=0;i<days;i++){
    const d = addDays(todayDate(), i);
    mealsForDate(d, profile).forEach(({slot,time,recipe})=>{
      const start = dateAtTime(d, time);
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+dateKey(d)+'-'+slot+'@vitality-app');
      lines.push('DTSTAMP:'+stamp);
      lines.push('DTSTART:'+icsFmt(start));
      lines.push('DTEND:'+icsFmt(new Date(start.getTime()+30*60000)));
      lines.push('SUMMARY:'+icsEscape(slot.charAt(0).toUpperCase()+slot.slice(1)+': '+recipe.name));
      lines.push('DESCRIPTION:'+icsEscape(recipe.ingredients.join(', ')+' — '+recipe.k+' kcal'));
      lines.push('END:VEVENT');
    });
    const w = workoutForDate(d, profile);
    if(w.exercises.length){
      const start = dateAtTime(d, WORKOUT_TIME);
      const mins = workoutDurationMin(w);
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+dateKey(d)+'-workout@vitality-app');
      lines.push('DTSTAMP:'+stamp);
      lines.push('DTSTART:'+icsFmt(start));
      lines.push('DTEND:'+icsFmt(new Date(start.getTime()+mins*60000)));
      lines.push('SUMMARY:'+icsEscape('Workout: '+w.label));
      lines.push('DESCRIPTION:'+icsEscape(w.exercises.map(e=>e.name+' '+e.sets+'x'+e.reps).join(', ')));
      lines.push('END:VEVENT');
    }
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function findExerciseInQuery(query){
  const q = query.toLowerCase();
  const ids = Object.keys(EXERCISE_ALIASES).sort((a,b)=>{
    const la = Math.max(...EXERCISE_ALIASES[a].map(s=>s.length));
    const lb = Math.max(...EXERCISE_ALIASES[b].map(s=>s.length));
    return lb-la;
  });
  for(const id of ids){
    if(EXERCISE_ALIASES[id].some(alias=>q.includes(alias))) return id;
  }
  return null;
}
function answerVoiceQuery(query){
  const q = query.toLowerCase();
  const profile = state.profile;
  const d = ui.selectedDate ? parseDateKey(ui.selectedDate) : todayDate();
  const dkey = dateKey(d);
  const w = workoutForDate(d, profile);
  const log = getLog(dkey);

  const exId = findExerciseInQuery(q);
  if(exId && (q.includes('how much')||q.includes('how many')||q.includes('weight')||q.includes('pound')||q.includes('last time')||q.includes('heavy'))){
    const last = lastLoggedWeight(exId);
    if(last) return 'Last time you logged '+EX[exId].name+', you did '+last.weight+' pounds for '+last.reps+' reps.';
    const inPlan = w.exercises.find(e=>e.id===exId);
    if(inPlan) return "You haven't logged "+EX[exId].name+' yet. Today calls for '+inPlan.sets+' sets of '+inPlan.reps+' reps — start conservative and log it after.';
    return "I don't have any history for "+EX[exId].name+' yet.';
  }
  if(q.includes('next workout')||(q.includes('today') && q.includes('workout'))||q.includes("what's next")||q.includes('whats next')||q.includes('workout today')){
    if(!w.exercises.length) return "Today is a rest day. Recovery is part of the program.";
    const remaining = w.exercises.filter(e=>!log.completedExercises.includes(e.id));
    if(!remaining.length) return "You've finished today's "+w.label+' workout. Nice work.';
    return "Today's workout is "+w.label+'. Next up: '+remaining[0].name+', '+remaining[0].sets+' sets of '+remaining[0].reps+' reps.';
  }
  if(q.includes('breakfast')||q.includes('lunch')||q.includes('dinner')||q.includes('snack')){
    const slot = ['breakfast','lunch','dinner','snack'].find(s=>q.includes(s));
    const meal = mealsForDate(d, profile).find(m=>m.slot===slot);
    return 'For '+slot+", you've got "+meal.recipe.name+', about '+meal.recipe.k+' calories.';
  }
  if(q.includes('calorie')){
    const {kcalIn,kcalOut} = macrosConsumedForDate(dkey, profile);
    const remaining = profile.derived.calorieTarget - kcalIn + kcalOut;
    return "You've eaten "+Math.round(kcalIn)+' calories and burned '+Math.round(kcalOut)+' so far. You have about '+Math.max(Math.round(remaining),0)+' calories left today.';
  }
  return "I can tell you today's workout, your last weight on an exercise, what's for breakfast, lunch, dinner or snack, or how many calories you have left. Try asking one of those.";
}
function startVoiceRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  ui.voice.supported = !!SR;
  if(!SR){ render(); return; }
  try{
    const rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    ui.voice.status = 'listening';
    render();
    rec.onresult = (evt)=>{
      const transcript = evt.results[0][0].transcript;
      ui.voice.transcript = transcript;
      ui.voice.status = 'thinking';
      render();
      const answer = answerVoiceQuery(transcript);
      ui.voice.response = answer;
      ui.voice.status = 'idle';
      render();
      speak(answer);
    };
    rec.onerror = ()=>{ ui.voice.status='error'; render(); };
    rec.onend = ()=>{ if(ui.voice.status==='listening'){ ui.voice.status='idle'; render(); } };
    rec.start();
  }catch(e){ ui.voice.status='error'; render(); }
}

function macrosConsumedForDate(dkey, profile){
  const log = getLog(dkey);
  let kcalIn=0,p=0,c=0,f=0,kcalOut=0;
  log.completedMeals.forEach(slot=>{
    const meals = mealsForDate(parseDateKey(dkey), profile);
    const m = meals.find(x=>x.slot===slot);
    if(m){ kcalIn+=m.recipe.k; p+=m.recipe.p; c+=m.recipe.c; f+=m.recipe.f; }
  });
  log.extraMeals.forEach(em=>{ kcalIn+=em.k; p+=em.p; c+=em.c; f+=em.f; });
  if(log.completedExercises && log.completedExercises.length){
    kcalOut += estimateWorkoutSessionCalories(log.completedExercises.length, profile.weightKg);
  }
  log.extraWorkouts.forEach(ew=> kcalOut += ew.calories);
  return {kcalIn,p,c,f,kcalOut};
}

function weekDaysFor(dateKeyStr){
  const d = parseDateKey(dateKeyStr);
  const weekday = (d.getDay()+6)%7; // 0=Mon
  const monday = addDays(d, -weekday);
  return Array.from({length:7}, (_,i)=>addDays(monday, i));
}

  return wrap;

function ringSvg(pct, size, color){
  pct = Math.max(0,Math.min(1,pct));
  const r = (size/2)-10;
  const circ = 2*Math.PI*r;
  const offset = circ*(1-pct);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--ring-track)" stroke-width="10"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'"/>'+
    '</svg>';
}
function statTile(label, val, color){
  const t = el('div','stat-tile');
  t.innerHTML = '<div class="eyebrow" style="color:'+color+';">'+label.toUpperCase()+'</div><div class="val">'+val+'</div><div class="unit">KCAL</div>';
  return t;
}
function macroRow(label, val, target, color){
  const wrap = el('div','macro-row');
  const pct = target>0 ? Math.min(val/target,1) : 0;
  wrap.innerHTML = '<div class="row-head"><span class="name">'+label+'</span><span class="val mono">'+Math.round(val)+'/'+Math.round(target)+'g</span></div>'+
    '<div class="bar"><i style="width:'+(pct*100)+'%;background:'+color+';"></i></div>';
  return wrap;
}
function bodySilhouette(activeMuscles){
  const legs = activeMuscles.includes('Legs');
  const torso = activeMuscles.some(m=>['Chest','Back','Shoulders','Core'].includes(m));
  const arms = activeMuscles.includes('Arms');
  const on = 'var(--amber)', off = 'var(--surface-2)';
  return '<svg width="46" height="86" viewBox="0 0 46 86">'+
    '<circle cx="23" cy="10" r="8" fill="'+off+'"/>'+
    '<rect x="10" y="20" width="26" height="30" rx="8" fill="'+(torso?on:off)+'"/>'+
    '<rect x="2" y="22" width="9" height="26" rx="4" fill="'+(arms?on:off)+'"/>'+
    '<rect x="35" y="22" width="9" height="26" rx="4" fill="'+(arms?on:off)+'"/>'+
    '<rect x="12" y="50" width="9" height="34" rx="4" fill="'+(legs?on:off)+'"/>'+
    '<rect x="25" y="50" width="9" height="34" rx="4" fill="'+(legs?on:off)+'"/>'+
    '</svg>';
}

/* ---------- Schedule sub-view ---------- */
function renderScheduleView(selDate, dkey, profile){
  const wrap = el('div','card');
  const log = getLog(dkey);
  const items = [];
  mealsForDate(selDate, profile).forEach(m=>items.push({type:'meal', time:m.time, slot:m.slot, title:m.recipe.name, sub:m.slot.charAt(0).toUpperCase()+m.slot.slice(1)+' · '+m.recipe.k+' kcal', done:log.completedMeals.includes(m.slot)}));
  const w = workoutForDate(selDate, profile);
  if(w.exercises.length) items.push({type:'workout', time:WORKOUT_TIME, title:w.label, sub:muscleGroupsForWorkout(w).join(' · ')+' · '+workoutDurationMin(w)+' min', done:log.workoutDone});
  items.sort((a,b)=> a.time.localeCompare(b.time));

  if(!items.length){ wrap.appendChild(el('div','empty-note','Rest day — nothing scheduled.')); return wrap; }

  items.forEach(it=>{
    const row = el('div','sched-row');
    row.appendChild(el('div','sched-time', it.time));
    const icon = el('div','sched-icon '+(it.type==='meal'?'meal':'workout'), it.type==='meal'?ICONS.fork:ICONS.dumbbell);
    row.appendChild(icon);
    const body = el('div','sched-body');
    body.innerHTML = '<div class="sched-title'+(it.done?' done':'')+'">'+it.title+'</div><div class="sched-sub">'+it.sub+'</div>';
    row.appendChild(body);
    const check = el('div','sched-check'+(it.done?' on':''), it.done?'✓':'');
    check.onclick = (e)=>{
      e.stopPropagation();
      if(it.type==='meal'){
        if(log.completedMeals.includes(it.slot)) log.completedMeals = log.completedMeals.filter(x=>x!==it.slot);
        else log.completedMeals.push(it.slot);
      } else {
        if(!w.exercises.length) return;
        if(log.workoutDone){ log.completedExercises=[]; log.workoutDone=false; }
        else { log.completedExercises = w.exercises.map(e=>e.id); log.workoutDone=true; }
      }
      saveState(); render();
    };
    row.appendChild(check);
    row.onclick = ()=>{ ui.scheduleView = it.type==='meal'?'meals':'workout'; render(); };
    wrap.appendChild(row);
  });
  return wrap;
}

  wrap.appendChild(el('h2',null,'Profile'));

  const card = el('div','card');
  card.appendChild(el('div','section-title','About you'));
  card.appendChild(statRow('Name', p.name||'—'));
  card.appendChild(statRow('Age', p.age));
  card.appendChild(statRow('Gender', p.gender));
  card.appendChild(statRow('Height', fmtHeight(p)));
  card.appendChild(statRow('Weight', fmtWeight(p)));
  card.appendChild(statRow('Units', p.units==='imperial' ? 'Feet/in · lb' : 'cm · kg'));
  card.appendChild(statRow('Goal', p.goal==='lose'?'Lose fat':p.goal==='gain'?'Build muscle':'Maintain'));
  card.appendChild(statRow('Activity', ACTIVITY_LABELS[p.activityLevel]));
  card.appendChild(statRow('Training days/week', p.daysPerWeek));
  const editBtn = el('button','btn btn-sm','Edit profile'); editBtn.style.marginTop='10px';
  editBtn.onclick = ()=>{ ui.modal={type:'editProfile'}; render(); };
  card.appendChild(editBtn);
  wrap.appendChild(card);

  const dietCard = el('div','card');
  dietCard.appendChild(el('div','section-title','Dietary preferences'));
  const grid = el('div','chip-grid');
  if(p.dietPrefs && p.dietPrefs.length){ p.dietPrefs.forEach(d=>grid.appendChild(el('span','pill on', d))); }
  else grid.appendChild(el('span','pill','No restrictions'));
  dietCard.appendChild(grid);
  wrap.appendChild(dietCard);

  const targetsCard = el('div','card');
  targetsCard.appendChild(el('div','section-title','Daily targets'));
  targetsCard.appendChild(statRow('BMI', calcBMI(p).toFixed(1)+' ('+bmiCategory(calcBMI(p))+')'));
  targetsCard.appendChild(statRow('BMR', p.derived.bmr+' kcal'));
  targetsCard.appendChild(statRow('TDEE', p.derived.tdee+' kcal'));
  targetsCard.appendChild(statRow('Calorie target', p.derived.calorieTarget+' kcal'));
  targetsCard.appendChild(statRow('Protein', p.derived.proteinG+' g'));
  targetsCard.appendChild(statRow('Carbs', p.derived.carbG+' g'));
  targetsCard.appendChild(statRow('Fat', p.derived.fatG+' g'));
  wrap.appendChild(targetsCard);

  const syncCard = el('div','card');
  syncCard.appendChild(el('div','section-title','Calendar sync'));
  syncCard.appendChild(el('p',null,'<span style="font-size:0.78rem;color:var(--text-muted);">Add today\'s plan to Google Calendar, or export the next 30 days for any other calendar app.</span>'));
  const gcalBtn = el('button','btn btn-cyan','Add today to Google Calendar'); gcalBtn.style.marginTop='10px';
  gcalBtn.onclick = ()=>{
    const d = todayDate();
    const w = workoutForDate(d, p);
    let url = gcalLink('Vitality: '+(w.exercises.length?w.label:'Rest Day'), w.exercises.map(e=>e.name).join(', '), dateAtTime(d, w.exercises.length?WORKOUT_TIME:MEAL_TIMES.breakfast), w.exercises.length?workoutDurationMin(w):30);
    window.open(url, '_blank');
  };
  syncCard.appendChild(gcalBtn);
  const icsBtn = el('button','btn','Export next 30 days (.ics)'); icsBtn.style.marginTop='10px';
  icsBtn.onclick = async ()=>{
    const ics = generateICS(p, 30);
    async function fallbackCopy(){
      try{ await navigator.clipboard.writeText(ics); alert('Copied your schedule to the clipboard. Paste it into a new text file named schedule.ics, then import that into your calendar app.'); }
      catch(e2){ alert('Calendar export isn\'t available in this view.'); }
    }
    try{
      const downloads = window.claude && await window.claude.use('downloads');
      if(downloads){
        await downloads.save({filename:'vitality-schedule.txt', data: ics});
        alert('Saved as vitality-schedule.txt — rename the file extension to .ics, then import it into Google Calendar, Apple Calendar, or Outlook.');
      } else {
        await fallbackCopy();
      }
    }catch(e){ await fallbackCopy(); }
  };
  syncCard.appendChild(icsBtn);
  wrap.appendChild(syncCard);

  const supCard = el('div','card');
  supCard.appendChild(el('div','section-title','Suggested vitamins & supplements'));
  const applicable = SUPPLEMENT_RULES.filter(r=>r.test(p));
  applicable.forEach(r=>{
    const row = el('div'); row.style.marginBottom='10px';
    row.innerHTML = '<b style="font-size:0.85rem;">'+r.sup+'</b><div style="font-size:0.76rem;color:var(--text-muted);margin-top:2px;">'+r.why+'</div>';
    supCard.appendChild(row);
  });
  supCard.appendChild(el('div',null,'<div style="font-size:0.7rem;color:var(--text-faint);margin-top:6px;">General education, not medical advice — check with a doctor or dietitian before starting any supplement, especially if you take medication or have a health condition.</div>'));
  wrap.appendChild(supCard);

  return wrap;
}

/* ---------- Modals ---------- */
function renderModal(){
  const backdrop = el('div','modal-backdrop');
  backdrop.onclick = (e)=>{ if(e.target===backdrop){ ui.modal=null; render(); } };
  const sheet = el('div','modal-sheet');
  sheet.onclick = e=>e.stopPropagation();
  sheet.appendChild(el('div','modal-handle'));

  if(ui.modal.type==='logFood') sheet.appendChild(renderLogFoodModal());
  else if(ui.modal.type==='logWorkout') sheet.appendChild(renderLogWorkoutModal());
  else if(ui.modal.type==='editProfile') sheet.appendChild(renderEditProfileModal());
  else if(ui.modal.type==='voice') sheet.appendChild(renderVoiceModal());

  backdrop.appendChild(sheet);
  return backdrop;
}

function renderVoiceModal(){
  const wrap = el('div');
  wrap.appendChild(el('h3',null,'Ask Vitality'));
  if(ui.voice.supported===false){
    wrap.appendChild(el('div','empty-note','Voice control isn\'t supported in this browser. Try Chrome or Edge, and open the app in its own tab rather than an embedded preview.'));
  } else {
    wrap.appendChild(el('p',null,'<span style="font-size:0.8rem;color:var(--text-muted);">Tap the mic and ask about today\'s workout, a specific exercise\'s last weight, what\'s for a meal, or calories left. If the mic doesn\'t respond, try opening this app in its own browser tab.</span>'));
    if(ui.voice.transcript) wrap.appendChild(el('div','voice-bubble you','"'+ui.voice.transcript+'"'));
    if(ui.voice.response) wrap.appendChild(el('div','voice-bubble app', ui.voice.response));
    const micBtn = el('button','btn btn-primary', ui.voice.status==='listening' ? 'Listening…' : 'Tap to speak');
    micBtn.onclick = ()=>{ startVoiceRecognition(); };
    wrap.appendChild(micBtn);
    const openTab = el('button','btn btn-ghost','Open app in a new tab'); openTab.style.marginTop='10px';
    openTab.onclick = ()=>{ window.open(window.location.href, '_blank'); };
    wrap.appendChild(openTab);
    const suggest = el('div','voice-suggest');
    ["What's next?","How heavy was my bench press?","What's for dinner?","How many calories left?"].forEach(s=>{
      const b = el('button',null,s);
      b.onclick = ()=>{ ui.voice.transcript=s; ui.voice.response=answerVoiceQuery(s); render(); speak(ui.voice.response); };
      suggest.appendChild(b);
    });
    wrap.appendChild(suggest);
  }
  return wrap;
}

function renderLogFoodModal(){
  const wrap = el('div');
  wrap.appendChild(el('h3',null,'Log food'));
  wrap.appendChild(el('p',null,'<span style="font-size:0.8rem;color:var(--text-muted);">Search our food database for an instant estimate, or enter your own if you can\'t find it.</span>'));
  const input = el('input'); input.type='text'; input.placeholder='e.g. donut, chicken breast, pizza'; input.value=ui.foodQuery;
  input.oninput = e=>{ ui.foodQuery = e.target.value; ui.foodPicked=null; renderFoodSuggestions(); };
  wrap.appendChild(input);
  const suggestBox = el('div','food-suggest'); suggestBox.id='food-suggest-box';
  wrap.appendChild(suggestBox);

  function renderFoodSuggestions(){
    suggestBox.innerHTML='';
    const results = foodSearch(ui.foodQuery);
    if(!results.length){ suggestBox.style.display='none'; return; }
    suggestBox.style.display='block';
    results.forEach(f=>{
      const opt = el('div','food-opt', '<b>'+f.n+'</b><br><span style="color:var(--text-faint);font-size:0.72rem;">'+f.u+' · '+f.k+' kcal</span>');
      opt.onclick = ()=>{ ui.foodPicked=f; ui.foodQuery=f.n; ui.foodMultiplier=1; suggestBox.style.display='none'; input.value=f.n; renderPicked(); };
      suggestBox.appendChild(opt);
    });
  }
  renderFoodSuggestions();

  const pickedArea = el('div'); pickedArea.id='picked-area'; pickedArea.style.marginTop='12px';
  wrap.appendChild(pickedArea);

  function renderPicked(){
    pickedArea.innerHTML='';
    if(ui.foodPicked){
      const f = ui.foodPicked;
      const row = el('div','row'); row.style.gap='10px'; row.style.alignItems='center';
      row.appendChild(el('span',null,'<span style="font-size:0.82rem;">Servings ('+f.u+')</span>'));
      const qty = el('input'); qty.type='number'; qty.step='0.5'; qty.value=ui.foodMultiplier; qty.style.width='80px';
      qty.oninput = e=>{ ui.foodMultiplier = parseFloat(e.target.value)||0; renderPicked(); };
      row.appendChild(qty);
      pickedArea.appendChild(row);
      const mult = ui.foodMultiplier||0;
      const totals = el('div','grid-3'); totals.style.marginTop='10px';
      totals.appendChild(statTile('Calories', Math.round(f.k*mult), 'var(--cyan)'));
      totals.appendChild(statTile('Protein', Math.round(f.p*mult), 'var(--cyan)'));
      totals.appendChild(statTile('Carb/Fat', Math.round(f.c*mult)+'/'+Math.round(f.f*mult), 'var(--amber)'));
      pickedArea.appendChild(totals);
      const saveBtn = el('button','btn btn-primary','Add to log'); saveBtn.style.marginTop='14px';
      saveBtn.onclick = ()=>{
        const log = getLog(ui.modal.dkey);
        log.extraMeals.push({name:f.n+' ×'+mult, k:Math.round(f.k*mult), p:Math.round(f.p*mult), c:Math.round(f.c*mult), f:Math.round(f.f*mult)});
        saveState();
        ui.modal=null; ui.foodQuery=''; ui.foodPicked=null;
        render();
      };
      pickedArea.appendChild(saveBtn);
    } else if(ui.foodQuery && !foodSearch(ui.foodQuery).length){
      pickedArea.innerHTML = '<div class="divider"></div><div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:8px;">Not in our database — enter your best estimate:</div>';
      const calInput = el('input'); calInput.type='number'; calInput.placeholder='Estimated calories (kcal)';
      pickedArea.appendChild(calInput);
      const saveBtn = el('button','btn btn-primary','Add to log'); saveBtn.style.marginTop='10px';
      saveBtn.onclick = ()=>{
        const kcal = parseFloat(calInput.value)||0;
        const log = getLog(ui.modal.dkey);
        log.extraMeals.push({name:ui.foodQuery, k:kcal, p:0, c:0, f:0});
        saveState();
        ui.modal=null; ui.foodQuery=''; ui.foodPicked=null;
        render();
      };
      pickedArea.appendChild(saveBtn);
    }
  }
  return wrap;
}

function renderLogWorkoutModal(){
  const wrap = el('div');
  wrap.appendChild(el('h3',null,'Log activity'));
  const seg = el('div','seg'); seg.style.marginBottom='14px';
  ['estimate','manual'].forEach(mode=>{
    const b = el('button', ui.exerciseMode===mode?'active':'', mode==='estimate'?'Estimate for me':'I know the calories');
    b.onclick = ()=>{ ui.exerciseMode=mode; render(); };
    seg.appendChild(b);
  });
  wrap.appendChild(seg);

  if(ui.exerciseMode==='estimate'){
    wrap.appendChild(el('p',null,'<span style="font-size:0.78rem;color:var(--text-muted);">We estimate calories burned using the MET method (Compendium of Physical Activities) and your body weight.</span>'));
    const sel = el('select');
    EXERCISE_METS.forEach(m=>{ const o=el('option'); o.value=m.name; o.textContent=m.name; if(m.name===ui.exerciseDropdown)o.selected=true; sel.appendChild(o); });
    sel.onchange = e=>{ ui.exerciseDropdown = e.target.value; renderPreview(); };
    wrap.appendChild(el('label','field','Activity'));
    wrap.appendChild(sel);
    wrap.appendChild(el('label','field','Duration (minutes)'));
    const mins = el('input'); mins.type='number'; mins.value=ui.exerciseMinutes;
    mins.oninput = e=>{ ui.exerciseMinutes = parseInt(e.target.value)||0; renderPreview(); };
    wrap.appendChild(mins);
    const preview = el('div'); preview.style.marginTop='12px'; preview.id='ex-preview';
    wrap.appendChild(preview);
    function renderPreview(){
      const met = EXERCISE_METS.find(m=>m.name===ui.exerciseDropdown).met;
      const kcal = estimateCaloriesFromMet(met, state.profile.weightKg, ui.exerciseMinutes);
      preview.innerHTML = '<div class="card" style="text-align:center;"><div class="mono" style="font-size:1.4rem;font-weight:700;">'+kcal+' kcal</div><div style="font-size:0.7rem;color:var(--text-faint);">estimated burn</div></div>';
    }
    renderPreview();
    const saveBtn = el('button','btn btn-primary','Log activity'); saveBtn.style.marginTop='14px';
    saveBtn.onclick = ()=>{
      const met = EXERCISE_METS.find(m=>m.name===ui.exerciseDropdown).met;
      const kcal = estimateCaloriesFromMet(met, state.profile.weightKg, ui.exerciseMinutes);
      const log = getLog(ui.modal.dkey);
      log.extraWorkouts.push({name:ui.exerciseDropdown, minutes:ui.exerciseMinutes, calories:kcal});
      saveState(); ui.modal=null; render();
    };
    wrap.appendChild(saveBtn);
  } else {
    wrap.appendChild(el('label','field','What did you do?'));
    const nameInput = el('input'); nameInput.type='text'; nameInput.placeholder='e.g. Bike ride, 2 hours';
    wrap.appendChild(nameInput);
    wrap.appendChild(el('label','field','Calories burned (from your smartwatch, etc.)'));
    const calInput = el('input'); calInput.type='number'; calInput.placeholder='e.g. 650';
    wrap.appendChild(calInput);
    const saveBtn = el('button','btn btn-primary','Log activity'); saveBtn.style.marginTop='14px';
    saveBtn.onclick = ()=>{
      const log = getLog(ui.modal.dkey);
      log.extraWorkouts.push({name:nameInput.value||'Activity', minutes:null, calories:parseFloat(calInput.value)||0});
      saveState(); ui.modal=null; render();
    };
    wrap.appendChild(saveBtn);
  }
  return wrap;
}

function renderEditProfileModal(){
  const wrap = el('div');
  wrap.appendChild(el('h3',null,'Edit profile'));
  const d = {...state.profile};
  const unitsField = el('div');
  wrap.appendChild(unitsField);
  function renderBody(){
    wrap.innerHTML = '';
    wrap.appendChild(el('h3',null,'Edit profile'));
    wrap.appendChild(fieldSeg('Units', d.units, ['imperial','metric'], ['Feet/in · lb','cm · kg'], v=>{ d.units=v; renderBody(); }));
    const stack = el('div','stack');
    stack.appendChild(fieldText('Name', d.name, v=>d.name=v));
    stack.appendChild(fieldNumber('Age', d.age, v=>d.age=v));
    stack.appendChild(fieldSeg('Gender', d.gender, ['male','female','other'], ['Male','Female','Other'], v=>d.gender=v));
    if(d.units==='imperial'){
      const {ft,inch} = cmToFtIn(d.heightCm);
      const hrow = el('div','row'); hrow.style.gap='10px';
      hrow.appendChild(fieldNumber('Height (ft)', ft, v=>{ d.heightCm = ftInToCm(v, cmToFtIn(d.heightCm).inch); }, 3, 8));
      hrow.appendChild(fieldNumber('Height (in)', inch, v=>{ d.heightCm = ftInToCm(cmToFtIn(d.heightCm).ft, v); }, 0, 11));
      stack.appendChild(hrow);
      stack.appendChild(fieldNumber('Weight (lb)', kgToLb(d.weightKg), v=>{ d.weightKg = lbToKg(v); }, 60, 550));
    } else {
      stack.appendChild(fieldNumber('Height (cm)', d.heightCm, v=>d.heightCm=v));
      stack.appendChild(fieldNumber('Weight (kg)', d.weightKg, v=>d.weightKg=v));
    }
    stack.appendChild(fieldSeg('Goal', d.goal, ['lose','maintain','gain'], ['Lose fat','Maintain','Build muscle'], v=>d.goal=v));
    stack.appendChild(fieldSeg('Days/week', String(d.daysPerWeek), ['3','4','5','6'], ['3','4','5','6'], v=>d.daysPerWeek=parseInt(v)));
    wrap.appendChild(stack);
    const grid = el('div','chip-grid'); grid.style.marginTop='10px';
    [['vegetarian','Vegetarian'],['vegan','Vegan'],['glutenFree','Gluten-free'],['lactoseFree','Lactose-free']].forEach(([key,label])=>{
      const chip = el('button','chip'+(d.dietPrefs.includes(key)?' on':''), label);
      chip.onclick=()=>{ if(d.dietPrefs.includes(key)) d.dietPrefs=d.dietPrefs.filter(x=>x!==key); else d.dietPrefs.push(key); renderBody(); };
      grid.appendChild(chip);
    });
    wrap.appendChild(grid);
    const saveBtn = el('button','btn btn-primary','Save changes'); saveBtn.style.marginTop='14px';
    saveBtn.onclick = ()=>{
      d.derived = calcDerived(d);
      state.profile = d;
      saveState(); ui.modal=null; render();
    };
    wrap.appendChild(saveBtn);
  }
  renderBody();
  return wrap;
}

render();
</script>
