<style>

    --text:#12141C;
    --text-muted:#5B6478;
    --text-faint:#8891A3;
    --accent:#0AA98A;
    --accent-2:#6D4CE0;
    --accent-ink:#FFFFFF;
    --success:#1E9E5A;
    --warning:#B87407;
    --danger:#D8433A;
    --ring-track:#DEE3EE;
    --shadow: 0 8px 24px -12px rgba(20,25,40,0.18);

    --radius-md: 16px;

  }
  @media (prefers-color-scheme: dark){

      --surface-alt:#1D2330;
      --border:#2A3140;
      --text:#EEF1F8;
      --text-muted:#96A0B4;
      --text-faint:#69728A;
      --accent:#2FE9C4;
      --accent-2:#9B82FF;
      --accent-ink:#04241D;
      --success:#3EDB8F;
      --warning:#FBBF4A;
      --danger:#FF6B62;
      --ring-track:#232A38;
      --shadow: 0 10px 30px -12px rgba(0,0,0,0.55);
      color-scheme: dark;
    }
  }

    --bg:#0B0E15;
    --bg-elev:#0F131C;
    --surface:#161B26;
    --surface-alt:#1D2330;
    --border:#2A3140;
    --text:#EEF1F8;
    --text-muted:#96A0B4;
    --text-faint:#69728A;
    --accent:#2FE9C4;
    --accent-2:#9B82FF;
    --accent-ink:#04241D;
    --success:#3EDB8F;
    --warning:#FBBF4A;

  html,body{margin:0;padding:0;}

  input,select,textarea{ font-family:inherit; }

    background:var(--bg-elev);
    border-radius:32px;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
    min-height:calc(100vh - 36px);
    display:flex;
    flex-direction:column;
  }
  .topbar{
    padding:18px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, var(--surface) 0%, var(--bg-elev) 100%);
    flex-shrink:0;
  }
  .brand{
    display:flex; align-items:center; gap:8px;
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.05rem; letter-spacing:0.03em;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 0 10px var(--accent);
    flex-shrink:0;
  }
  .topbar-actions{ display:flex; gap:8px; align-items:center; }
  .icon-btn{
    width:36px;height:36px;border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{ transform:scale(0.94); }

  .screen{
    flex:1;
    overflow-y:auto;
    padding:18px 18px 100px;
    -webkit-overflow-scrolling:touch;
  }
  .screen::-webkit-scrollbar{ width:0; }

  .tabbar{
    position:absolute; left:0; right:0; bottom:0;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));
    gap:2px;
  }
  .tab{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; cursor:pointer;
    color:var(--text-faint);
    padding:6px 2px;
    border-radius:12px;
    font-size:0.66rem;
    font-weight:600;
    letter-spacing:0.02em;
  }
  .tab.active{ color:var(--accent); }
  .tab svg{ width:21px; height:21px; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px;
  }
  .card + .card{ margin-top:14px; }
  .section{ margin-bottom:18px; }
  .section-title{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--text-faint);
    font-weight:700;
    margin:0 0 10px 2px;
  }

  .between{ justify-content:space-between; }
  .stack{ display:flex; flex-direction:column; gap:10px; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

  .pill{
    display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px;
    border-radius:100px;
    font-size:0.7rem;
    font-weight:700;
    background:var(--surface-alt);
    color:var(--text-muted);
    border:1px solid var(--border);
    white-space:nowrap;
  }
  .pill.on{
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, transparent), color-mix(in srgb, var(--accent-2) 18%, transparent));

    border-color:var(--accent);

  .pill.warning{ color:var(--warning); border-color:var(--warning); }

    background:var(--surface-alt);
    color:var(--text);

  .btn-danger{ background:transparent; color:var(--danger); border-color:var(--danger); }

  .modal-sheet{
    background:var(--surface); width:100%; max-height:88%; overflow-y:auto;

  .modal-handle{ width:38px; height:4px; border-radius:4px; background:var(--border); margin:0 auto 14px; }

  .empty-note{ font-size:0.8rem; color:var(--text-faint); text-align:center; padding:14px 6px; }
  .divider{ height:1px; background:var(--border); margin:14px 0; }
  a.link{ color:var(--accent); text-decoration:none; font-weight:600; font-size:0.8rem; }
  .glow-text{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  ::selection{ background:color-mix(in srgb, var(--accent) 35%, transparent); }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

}

function epochDay(d){ return Math.floor(d.getTime()/86400000); }
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayDate(){ const d=new Date(); d.setHours(0,0,0,0); return d; }

function calcBMR(p){
  const {weightKg,heightCm,age,gender} = p;
  if(gender==='male') return 10*weightKg + 6.25*heightCm - 5*age + 5;
  if(gender==='female') return 10*weightKg + 6.25*heightCm - 5*age - 161;
  return 10*weightKg + 6.25*heightCm - 5*age - 78;
}
function calcDerived(p){
  const bmr = calcBMR(p);
  const tdee = bmr * ACTIVITY_MULT[p.activityLevel];
  let calorieTarget;
  if(p.goal==='lose') calorieTarget = Math.max(tdee-500, p.gender==='male'?1500:1200);
  else if(p.goal==='gain') calorieTarget = tdee+350;
  else calorieTarget = tdee;
  const proteinPerKg = p.goal==='lose' ? 2.0 : p.goal==='gain' ? 1.8 : 1.6;
  const proteinG = Math.round(proteinPerKg * p.weightKg);
  const proteinCal = proteinG*4;
  const fatG = Math.round(Math.max(0.8*p.weightKg, calorieTarget*0.25/9));
  const fatCal = fatG*9;
  const carbCal = Math.max(calorieTarget - proteinCal - fatCal, 0);
  const carbG = Math.round(carbCal/4);
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), calorieTarget:Math.round(calorieTarget), proteinG, fatG, carbG};
}

function dietFilter(recipe, prefs){
  if(prefs.includes('vegan')) return recipe.vegan;
  if(prefs.includes('vegetarian') && !recipe.vegetarian) return false;
  if(prefs.includes('glutenFree') && !recipe.glutenFree) return false;
  if(prefs.includes('lactoseFree') && !recipe.dairyFree) return false;
  return true;
}
function recipesForSlot(slot, prefs){
  const pool = RECIPES.filter(r=>r.slot===slot && dietFilter(r,prefs));
  return pool.length ? pool : RECIPES.filter(r=>r.slot===slot);
}
function mealsForDate(d, profile){
  const ed = epochDay(d);
  const slots = ['breakfast','lunch','dinner','snack'];
  const prefs = profile.dietPrefs||[];
  return slots.map(slot=>{
    const pool = recipesForSlot(slot, prefs);
    const idx = ed % pool.length;
    return {slot, recipe:pool[idx]};
  });
}
function workoutForDate(d, profile){
  const weekday = ((d.getDay()+6)%7)+1; // 1=Mon..7=Sun
  const split = WORKOUT_SPLITS[profile.daysPerWeek] || WORKOUT_SPLITS[4];
  const tmpl = split[weekday];
  if(!tmpl || !tmpl.exercises) return {label:'Rest & Recovery', exercises:[]};
  const reps = repsForGoal(profile.goal);
  const sets = setsForGoal(profile.goal);
  return {label:tmpl.label, exercises: tmpl.exercises.map(id=>({id, ...EX[id], reps, sets}))};
}

function getLog(key){
  if(!state.logs[key]) state.logs[key] = {completedExercises:[], workoutDone:false, completedMeals:[], extraWorkouts:[], extraMeals:[]};
  return state.logs[key];
}

// MET-based calorie estimate: kcal = MET * weightKg * hours (Compendium of Physical Activities method)
function estimateCaloriesFromMet(met, weightKg, minutes){
  return Math.round(met * weightKg * (minutes/60));
}
// rough resistance-training session estimate for scheduled workouts
function estimateWorkoutSessionCalories(numExercises, weightKg){
  const minutesEach = 7; // work + rest per exercise, rough average
  return estimateCaloriesFromMet(5.0, weightKg, numExercises*minutesEach);
}

function foodSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const starts = [], includes = [];
  FOOD_DB.forEach(f=>{
    const n = f.n.toLowerCase();
    if(n.startsWith(q)) starts.push(f);
    else if(n.includes(q)) includes.push(f);
  });
  return starts.concat(includes).slice(0,8);
}

/* Exercise weight history (progressive overload tracker) */
function logExerciseSet(exId, weight, reps){
  if(!state.exerciseHistory[exId]) state.exerciseHistory[exId] = [];
  const key = dateKey(todayDate());
  const hist = state.exerciseHistory[exId];
  const existing = hist.find(h=>h.date===key);
  if(existing){ existing.weight=weight; existing.reps=reps; }
  else hist.push({date:key, weight, reps});
  saveState();
}
function lastLoggedWeight(exId){
  const hist = state.exerciseHistory[exId];
  if(!hist || !hist.length) return null;
  const todayKey = dateKey(todayDate());
  const prior = hist.filter(h=>h.date!==todayKey);
  if(!prior.length) return null;
  return prior[prior.length-1];
}

      };

    });

  const nav = el('div','row'); nav.style.marginTop='16px'; nav.style.gap='10px';
  if(ui.onboardStep>0){
    const back = el('button','btn btn-ghost','Back');
    back.onclick=()=>{ ui.onboardStep--; render(); };
    nav.appendChild(back);
  }
  const next = el('button','btn btn-primary', stepKey==='review' ? 'Enter Vitality' : 'Continue');
  next.onclick=()=>{
    if(stepKey==='review'){

      p.derived = calcDerived(p);

/* ---------- Home / Dashboard ---------- */
function macrosConsumedForDate(dkey, profile){
  const log = getLog(dkey);
  let kcalIn=0,p=0,c=0,f=0,kcalOut=0;
  log.completedMeals.forEach(slot=>{
    const meals = mealsForDate(new Date(dkey), profile);
    const m = meals.find(x=>x.slot===slot);
    if(m){ kcalIn+=m.recipe.k; p+=m.recipe.p; c+=m.recipe.c; f+=m.recipe.f; }
  });
  log.extraMeals.forEach(em=>{ kcalIn+=em.k; p+=em.p; c+=em.c; f+=em.f; });
  if(log.completedExercises && log.completedExercises.length){
    kcalOut += estimateWorkoutSessionCalories(log.completedExercises.length, profile.weightKg);
  }
  log.extraWorkouts.forEach(ew=> kcalOut += ew.calories);
  return {kcalIn,p,c,f,kcalOut};
}
function ringSvg(pct, size, color){
  pct = Math.max(0,Math.min(1,pct));
  const r = (size/2)-9;
  const circ = 2*Math.PI*r;
  const offset = circ*(1-pct);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--ring-track)" stroke-width="9"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'"/>'+
    '</svg>';
}

function renderCalendar(){
  const wrap = el('div');
  const profile = state.profile;
  wrap.appendChild(el('h2',null,'Calendar'));
  const nav = el('div','row between'); nav.style.marginBottom='12px';
  const prev = el('button','icon-btn','‹'); prev.onclick=()=>{ ui.calendarMonth--; if(ui.calendarMonth<0){ui.calendarMonth=11;ui.calendarYear--;} render(); };
  const label = el('div',null,'<b>'+new Date(ui.calendarYear,ui.calendarMonth,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</b>');
  const next = el('button','icon-btn','›'); next.onclick=()=>{ ui.calendarMonth++; if(ui.calendarMonth>11){ui.calendarMonth=0;ui.calendarYear++;} render(); };
  nav.appendChild(prev); nav.appendChild(label); nav.appendChild(next);
  wrap.appendChild(nav);

  const grid = el('div'); grid.style.display='grid'; grid.style.gridTemplateColumns='repeat(7,1fr)'; grid.style.gap='6px';
  ['M','T','W','T','F','S','S'].forEach(d=>{ const h=el('div',null,d); h.style.textAlign='center'; h.style.fontSize='0.65rem'; h.style.color='var(--text-faint)'; h.style.fontWeight='700'; grid.appendChild(h); });

  const first = new Date(ui.calendarYear, ui.calendarMonth, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(ui.calendarYear, ui.calendarMonth+1, 0).getDate();
  const totalCells = Math.ceil((startOffset+daysInMonth)/7)*7;
  const todayKey = dateKey(todayDate());

  for(let i=0;i<totalCells;i++){
    const dayNum = i - startOffset + 1;
    const cellDate = new Date(ui.calendarYear, ui.calendarMonth, dayNum);
    const key = dateKey(cellDate);
    const inMonth = dayNum>=1 && dayNum<=daysInMonth;
    const cell = el('div','day-cell'+(key===todayKey?' today':'')+(inMonth?'':' other-month'));
    const log = state.logs[key];
    const w = workoutForDate(cellDate, profile);
    const dots = [];
    if(w.exercises.length) dots.push('<span class="dot" style="background:var(--accent-2);"></span>');
    if(log && log.completedMeals.length) dots.push('<span class="dot" style="background:var(--accent);"></span>');
    cell.innerHTML = '<span>'+cellDate.getDate()+'</span><span class="dots">'+dots.join('')+'</span>';
    cell.onclick = ()=>{ ui.selectedDate=key; ui.modal={type:'dayDetail', dkey:key}; render(); };
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);

  const legend = el('div','row'); legend.style.marginTop='14px'; legend.style.gap='16px';
  legend.innerHTML = '<span style="font-size:0.72rem;color:var(--text-muted);"><span class="dot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-2);margin-right:5px;"></span>Workout</span>'+
    '<span style="font-size:0.72rem;color:var(--text-muted);"><span class="dot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:5px;"></span>Meals logged</span>';
  wrap.appendChild(legend);
  return wrap;
}

  }
  renderFoodSuggestions();

  const pickedArea = el('div'); pickedArea.id='picked-area'; pickedArea.style.marginTop='12px';
  wrap.appendChild(pickedArea);

  function renderPicked(){
    pickedArea.innerHTML='';
    if(ui.foodPicked){
      const f = ui.foodPicked;
      const row = el('div','row'); row.style.gap='10px'; row.style.alignItems='center';
      row.appendChild(el('span',null,'<span style="font-size:0.82rem;">Servings ('+f.u+')</span>'));
      const qty = el('input'); qty.type='number'; qty.step='0.5'; qty.value=ui.foodMultiplier; qty.style.width='80px';
      qty.oninput = e=>{ ui.foodMultiplier = parseFloat(e.target.value)||0; renderPicked(); };
      row.appendChild(qty);
      pickedArea.appendChild(row);
      const mult = ui.foodMultiplier||0;
      const totals = el('div','grid-3'); totals.style.marginTop='10px';
      totals.appendChild(miniStat('Calories', Math.round(f.k*mult)+' kcal'));
      totals.appendChild(miniStat('Protein', Math.round(f.p*mult)+'g'));
      totals.appendChild(miniStat('Carbs/Fat', Math.round(f.c*mult)+'/'+Math.round(f.f*mult)+'g'));
      pickedArea.appendChild(totals);
      const saveBtn = el('button','btn btn-primary','Add to log'); saveBtn.style.marginTop='14px';
      saveBtn.onclick = ()=>{
        const log = getLog(ui.modal.dkey);
        log.extraMeals.push({name:f.n+' ×'+mult, k:Math.round(f.k*mult), p:Math.round(f.p*mult), c:Math.round(f.c*mult), f:Math.round(f.f*mult)});
        saveState();
        ui.modal=null; ui.foodQuery=''; ui.foodPicked=null;
        render();
      };
      pickedArea.appendChild(saveBtn);
    } else if(ui.foodQuery && !foodSearch(ui.foodQuery).length){
      pickedArea.innerHTML = '<div class="divider"></div><div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:8px;">Not in our database — enter your best estimate:</div>';
      const calInput = el('input'); calInput.type='number'; calInput.placeholder='Estimated calories (kcal)';
      pickedArea.appendChild(calInput);
      const saveBtn = el('button','btn btn-primary','Add to log'); saveBtn.style.marginTop='10px';
      saveBtn.onclick = ()=>{
        const kcal = parseFloat(calInput.value)||0;
        const log = getLog(ui.modal.dkey);
        log.extraMeals.push({name:ui.foodQuery, k:kcal, p:0, c:0, f:0});
        saveState();
        ui.modal=null; ui.foodQuery=''; ui.foodPicked=null;
        render();
      };
      pickedArea.appendChild(saveBtn);
    }
  }
  return wrap;
}

function renderLogWorkoutModal(){
  const wrap = el('div');
  wrap.appendChild(el('h3',null,'Log activity'));
  const seg = el('div','seg'); seg.style.marginBottom='14px';
  ['estimate','manual'].forEach(mode=>{
    const b = el('button', ui.exerciseMode===mode?'active':'', mode==='estimate'?'Estimate for me':'I know the calories');
    b.onclick = ()=>{ ui.exerciseMode=mode; render(); };
    seg.appendChild(b);
  });
  wrap.appendChild(seg);

  if(ui.exerciseMode==='estimate'){
    wrap.appendChild(el('p',null,'<span style="font-size:0.78rem;color:var(--text-muted);">We estimate calories burned using the MET method (Compendium of Physical Activities) and your body weight.</span>'));
    const sel = el('select');
    EXERCISE_METS.forEach(m=>{ const o=el('option'); o.value=m.name; o.textContent=m.name; if(m.name===ui.exerciseDropdown)o.selected=true; sel.appendChild(o); });
    sel.onchange = e=>{ ui.exerciseDropdown = e.target.value; renderPreview(); };
    wrap.appendChild(el('label','field','Activity'));
    wrap.appendChild(sel);
    wrap.appendChild(el('label','field','Duration (minutes)'));
    const mins = el('input'); mins.type='number'; mins.value=ui.exerciseMinutes;
    mins.oninput = e=>{ ui.exerciseMinutes = parseInt(e.target.value)||0; renderPreview(); };
    wrap.appendChild(mins);
    const preview = el('div'); preview.style.marginTop='12px'; preview.id='ex-preview';
    wrap.appendChild(preview);
    function renderPreview(){
      const met = EXERCISE_METS.find(m=>m.name===ui.exerciseDropdown).met;
      const kcal = estimateCaloriesFromMet(met, state.profile.weightKg, ui.exerciseMinutes);
      preview.innerHTML = '<div class="card" style="text-align:center;"><div class="mono" style="font-size:1.4rem;font-weight:700;">'+kcal+' kcal</div><div style="font-size:0.7rem;color:var(--text-faint);">estimated burn</div></div>';
    }
    renderPreview();
    const saveBtn = el('button','btn btn-primary','Log activity'); saveBtn.style.marginTop='14px';
    saveBtn.onclick = ()=>{
      const met = EXERCISE_METS.find(m=>m.name===ui.exerciseDropdown).met;
      const kcal = estimateCaloriesFromMet(met, state.profile.weightKg, ui.exerciseMinutes);
      const log = getLog(ui.modal.dkey);
      log.extraWorkouts.push({name:ui.exerciseDropdown, minutes:ui.exerciseMinutes, calories:kcal});
      saveState(); ui.modal=null; render();
    };
    wrap.appendChild(saveBtn);
  } else {
    wrap.appendChild(el('label','field','What did you do?'));
    const nameInput = el('input'); nameInput.type='text'; nameInput.placeholder='e.g. Bike ride, 2 hours';
    wrap.appendChild(nameInput);
    wrap.appendChild(el('label','field','Calories burned (from your smartwatch, etc.)'));
    const calInput = el('input'); calInput.type='number'; calInput.placeholder='e.g. 650';
    wrap.appendChild(calInput);
    const saveBtn = el('button','btn btn-primary','Log activity'); saveBtn.style.marginTop='14px';
    saveBtn.onclick = ()=>{
      const log = getLog(ui.modal.dkey);
      log.extraWorkouts.push({name:nameInput.value||'Activity', minutes:null, calories:parseFloat(calInput.value)||0});
      saveState(); ui.modal=null; render();
    };
    wrap.appendChild(saveBtn);
  }
  return wrap;
}

function renderDayDetailModal(){
  const wrap = el('div');
  const dkey = ui.modal.dkey;
  const d = new Date(dkey);
  const profile = state.profile;
  const log = getLog(dkey);
  wrap.appendChild(el('h3',null,d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})));
  const w = workoutForDate(d, profile);
  wrap.appendChild(el('div','section-title','Workout'));
  wrap.appendChild(el('p',null,'<b>'+w.label+'</b>'+(w.exercises.length?' — '+w.exercises.map(e=>e.name).join(', '):'')));
  wrap.appendChild(el('div','section-title','Meals'));
  mealsForDate(d, profile).forEach(({slot,recipe})=>{
    wrap.appendChild(el('p',null,'<b>'+slot.charAt(0).toUpperCase()+slot.slice(1)+':</b> '+recipe.name+' ('+recipe.k+' kcal)'));
  });
  if(log.extraMeals.length || log.extraWorkouts.length){
    wrap.appendChild(el('div','section-title','Logged extras'));
    log.extraMeals.forEach(em=>wrap.appendChild(el('p',null,em.name+' — '+em.k+' kcal')));
    log.extraWorkouts.forEach(ew=>wrap.appendChild(el('p',null,ew.name+' — +'+ew.calories+' kcal burned')));
  }
  const closeBtn = el('button','btn','Close'); closeBtn.style.marginTop='10px';
  closeBtn.onclick = ()=>{ ui.modal=null; render(); };
  wrap.appendChild(closeBtn);
  return wrap;
}

function renderEditProfileModal(){
  const wrap = el('div');
  wrap.appendChild(el('h3',null,'Edit profile'));
  const d = {...state.profile};
  const stack = el('div','stack');
  stack.appendChild(fieldText('Name', d.name, v=>d.name=v));
  stack.appendChild(fieldNumber('Age', d.age, v=>d.age=v));
  stack.appendChild(fieldSeg('Gender', d.gender, ['male','female','other'], ['Male','Female','Other'], v=>d.gender=v));
  stack.appendChild(fieldNumber('Height (cm)', d.heightCm, v=>d.heightCm=v));
  stack.appendChild(fieldNumber('Weight (kg)', d.weightKg, v=>d.weightKg=v));
  stack.appendChild(fieldSeg('Goal', d.goal, ['lose','maintain','gain'], ['Lose fat','Maintain','Build muscle'], v=>d.goal=v));
  stack.appendChild(fieldSeg('Days/week', String(d.daysPerWeek), ['3','4','5','6'], ['3','4','5','6'], v=>d.daysPerWeek=parseInt(v)));
  wrap.appendChild(stack);
  const grid = el('div','chip-grid'); grid.style.marginTop='10px';
  [['vegetarian','Vegetarian'],['vegan','Vegan'],['glutenFree','Gluten-free'],['lactoseFree','Lactose-free']].forEach(([key,label])=>{
    const chip = el('button','chip'+(d.dietPrefs.includes(key)?' on':''), label);
    chip.onclick=()=>{ if(d.dietPrefs.includes(key)) d.dietPrefs=d.dietPrefs.filter(x=>x!==key); else d.dietPrefs.push(key); renderEditProfileModal_refresh(); };
    grid.appendChild(chip);
  });
  wrap.appendChild(grid);
  function renderEditProfileModal_refresh(){ ui.modal={type:'editProfile', draft:d}; render(); }
  const saveBtn = el('button','btn btn-primary','Save changes'); saveBtn.style.marginTop='14px';
  saveBtn.onclick = ()=>{
    d.derived = calcDerived(d);
    state.profile = d;
    saveState(); ui.modal=null; render();
  };
  wrap.appendChild(saveBtn);
  return wrap;
}

render();
</script>
